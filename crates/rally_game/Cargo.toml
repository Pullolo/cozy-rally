[package]
name = "rally_game"
version = "0.5.1"
edition = "2024"

[dependencies]
cpal = "0.15"
macroquad = "0.4"
rally_core = { version = "0.1.0", path = "../rally_core" }
rally_net = { version = "0.1.0", path = "../rally_net" }
# Gamepads: always on Windows/macOS. On Linux gilrs needs libudev headers (libudev-dev), so it
# is opt-in there: `cargo build -p rally_game --features gamepad-linux`.
gilrs = { version = "0.11", optional = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
gilrs = "0.11"

# Android (sideload APK, see android/README.md): JNI glue for the Java activity, and the JNI
# context cpal's oboe backend needs. Same versions cpal already pulls in.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[features]
default = []
gamepad-linux = ["dep:gilrs"]

